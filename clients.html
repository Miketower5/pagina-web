<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients — BrewStudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:       #FAF6F0;
      --dark:        #1A1209;
      --amber:       #C8782A;
      --amber-light: #E8973A;
      --moss:        #3D5A3E;
      --moss-light:  #5C8A5E;
      --terra:       #C4553A;
      --sky:         #2E5C7A;
      --gold:        #D4A843;
      --sidebar-w:   240px;
      --topbar-h:    60px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100vh;
    }

    /* ── SIDEBAR ─────────────────────────────────────────── */
    #sidebar {
      position: fixed;
      top: 0; left: 0;
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--dark);
      display: flex;
      flex-direction: column;
      padding: 28px 0 24px;
      z-index: 200;
      transition: transform 0.25s ease;
    }

    #sidebar-logo {
      font-family: 'Playfair Display', serif;
      color: var(--amber);
      font-size: 1.4rem;
      font-weight: 700;
      padding: 0 24px 28px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    #sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 16px 12px;
      flex: 1;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 6px;
      color: rgba(250,246,240,.6);
      text-decoration: none;
      font-size: .875rem;
      font-weight: 500;
      transition: background .15s, color .15s;
    }
    .nav-link svg { width: 16px; height: 16px; flex-shrink: 0; }
    .nav-link:hover { background: rgba(200,120,42,.08); color: var(--cream); }
    .nav-link.active { background: rgba(200,120,42,.12); color: var(--amber); }

    #sync-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 24px;
      border-top: 1px solid rgba(255,255,255,.07);
      font-size: .75rem;
      color: rgba(250,246,240,.5);
      font-family: 'DM Mono', monospace;
    }
    #sync-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--moss);
      flex-shrink: 0;
    }

    /* ── TOPBAR ──────────────────────────────────────────── */
    #topbar {
      position: fixed;
      top: 0;
      left: var(--sidebar-w);
      right: 0;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 28px;
      background: rgba(250,246,240,.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(26,18,9,.08);
      z-index: 100;
    }

    #page-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 600;
      flex: 1;
    }

    #hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--dark);
      padding: 4px;
    }

    #user-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--amber);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .05em;
    }

    /* ── MAIN ────────────────────────────────────────────── */
    #main-content {
      margin-left: var(--sidebar-w);
      padding: calc(var(--topbar-h) + 28px) 28px 48px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── KPI GRID ────────────────────────────────────────── */
    #kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .kpi-card {
      background: #fff;
      border: 1px solid rgba(26,18,9,.08);
      border-radius: 10px;
      padding: 20px 22px;
    }

    .kpi-card label {
      display: block;
      font-size: .75rem;
      font-weight: 500;
      color: rgba(26,18,9,.45);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }

    .kpi-number {
      font-family: 'DM Mono', monospace;
      font-size: 2rem;
      font-weight: 500;
      color: var(--dark);
      line-height: 1;
    }

    /* ── TOOLBAR ─────────────────────────────────────────── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #search-input {
      flex: 1;
      min-width: 220px;
      padding: 9px 14px;
      border: 1px solid rgba(26,18,9,.15);
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      background: #fff;
      outline: none;
      transition: border-color .15s;
    }
    #search-input:focus { border-color: var(--amber); }

    #filter-tabs {
      display: flex;
      gap: 4px;
      background: #fff;
      border: 1px solid rgba(26,18,9,.1);
      border-radius: 6px;
      padding: 4px;
    }

    .tab {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      background: none;
      font-family: 'DM Sans', sans-serif;
      font-size: .8125rem;
      font-weight: 500;
      cursor: pointer;
      color: rgba(26,18,9,.55);
      transition: background .15s, color .15s;
    }
    .tab:hover { color: var(--dark); }
    .tab.active { background: var(--amber); color: #fff; }

    #toolbar-actions { display: flex; gap: 8px; margin-left: auto; }

    button {
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
    }

    #add-client-btn {
      padding: 9px 18px;
      background: var(--amber);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: .875rem;
      font-weight: 600;
      transition: background .15s;
    }
    #add-client-btn:hover { background: var(--amber-light); }

    #export-csv-btn {
      padding: 9px 18px;
      background: none;
      color: var(--dark);
      border: 1px solid rgba(26,18,9,.2);
      border-radius: 6px;
      font-size: .875rem;
      font-weight: 500;
      transition: border-color .15s, background .15s;
    }
    #export-csv-btn:hover { border-color: var(--amber); background: rgba(200,120,42,.05); }

    /* ── CLIENTS GRID ────────────────────────────────────── */
    #clients-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    #empty-msg {
      grid-column: 1/-1;
      text-align: center;
      padding: 48px;
      color: rgba(26,18,9,.4);
      font-size: .9375rem;
    }

    .client-card {
      background: #fff;
      border: 1px solid rgba(26,18,9,.08);
      border-radius: 10px;
      display: flex;
      overflow: hidden;
      transition: box-shadow .15s, transform .15s;
    }
    .client-card:hover { box-shadow: 0 4px 20px rgba(26,18,9,.08); transform: translateY(-2px); }

    .client-stripe {
      width: 5px;
      flex-shrink: 0;
    }

    .client-body {
      padding: 18px 18px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .client-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 2px;
    }

    .client-meta {
      font-size: .8125rem;
      color: rgba(26,18,9,.5);
    }

    .client-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .03em;
    }

    .plan-badge { background: rgba(200,120,42,.1); color: var(--amber); }

    .status-active  { background: rgba(61,90,62,.12);  color: var(--moss); }
    .status-pending { background: rgba(212,168,67,.15); color: #a07a1a; }
    .status-paused  { background: rgba(26,18,9,.08);    color: rgba(26,18,9,.5); }

    .client-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .view-btn {
      flex: 1;
      padding: 7px 0;
      border: 1px solid rgba(26,18,9,.15);
      border-radius: 5px;
      background: none;
      font-size: .8125rem;
      font-weight: 500;
      color: var(--dark);
      transition: border-color .15s, background .15s;
    }
    .view-btn:hover { border-color: var(--amber); color: var(--amber); background: rgba(200,120,42,.04); }

    .del-btn {
      padding: 7px 10px;
      border: 1px solid rgba(196,85,58,.2);
      border-radius: 5px;
      background: none;
      font-size: .875rem;
      color: var(--terra);
      transition: background .15s;
    }
    .del-btn:hover { background: rgba(196,85,58,.08); }

    /* ── MODALS ──────────────────────────────────────────── */
    .hidden { display: none !important; }

    #modal-overlay,
    #view-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26,18,9,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 24px;
    }

    #client-modal,
    #view-modal {
      background: var(--cream);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    #modal-close,
    #view-close {
      position: absolute;
      top: 16px; right: 16px;
      background: none;
      border: none;
      font-size: 1.1rem;
      color: rgba(26,18,9,.4);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color .15s;
    }
    #modal-close:hover,
    #view-close:hover { color: var(--dark); }

    #client-modal h2,
    #view-modal h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      margin-bottom: 24px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .field label {
      font-size: .8125rem;
      font-weight: 600;
      color: rgba(26,18,9,.65);
    }

    .field input,
    .field select,
    .field textarea {
      padding: 9px 12px;
      border: 1px solid rgba(26,18,9,.15);
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      background: #fff;
      color: var(--dark);
      outline: none;
      transition: border-color .15s;
      resize: vertical;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus { border-color: var(--amber); }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    #modal-cancel {
      padding: 9px 20px;
      background: none;
      border: 1px solid rgba(26,18,9,.2);
      border-radius: 6px;
      font-size: .875rem;
      font-weight: 500;
      color: rgba(26,18,9,.6);
      transition: border-color .15s;
    }
    #modal-cancel:hover { border-color: var(--dark); color: var(--dark); }

    #modal-save {
      padding: 9px 20px;
      background: var(--amber);
      border: none;
      border-radius: 6px;
      font-size: .875rem;
      font-weight: 600;
      color: #fff;
      transition: background .15s;
    }
    #modal-save:hover { background: var(--amber-light); }

    /* view modal content */
    #view-content h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      margin-bottom: 16px;
    }
    #view-content p {
      font-size: .875rem;
      color: rgba(26,18,9,.75);
      padding: 8px 0;
      border-bottom: 1px solid rgba(26,18,9,.06);
    }
    #view-content p:last-child { border-bottom: none; }

    #view-edit-btn {
      padding: 9px 20px;
      background: var(--amber);
      border: none;
      border-radius: 6px;
      font-size: .875rem;
      font-weight: 600;
      color: #fff;
      transition: background .15s;
    }
    #view-edit-btn:hover { background: var(--amber-light); }

    /* ── RESPONSIVE ──────────────────────────────────────── */
    @media (max-width: 1024px) {
      #clients-grid { grid-template-columns: repeat(2, 1fr); }
      #kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }

      #topbar { left: 0; padding: 0 16px; }
      #hamburger { display: block; }

      #main-content { margin-left: 0; padding: calc(var(--topbar-h) + 20px) 16px 32px; }

      #clients-grid { grid-template-columns: 1fr; }
      #kpi-grid { grid-template-columns: repeat(2, 1fr); }

      #toolbar { flex-direction: column; align-items: stretch; }
      #search-input { min-width: unset; }
      #toolbar-actions { margin-left: 0; }
    }

    @media (max-width: 480px) {
      #kpi-grid { grid-template-columns: repeat(2, 1fr); }
      #filter-tabs { flex-wrap: wrap; }
    }
  </style>
</head>

  <script>
    // ── localStorage helpers ──────────────────────────────────
    function getData(key, fallback = []) {
      try { return JSON.parse(localStorage.getItem('brewstudio_' + key)) || fallback; }
      catch { return fallback; }
    }
    function saveData(key, value) {
      localStorage.setItem('brewstudio_' + key, JSON.stringify(value));
      scheduleSync();
    }

    // ── State ─────────────────────────────────────────────────
    let currentFilter = 'All';
    let searchQuery = '';

    // ── KPIs ─────────────────────────────────────────────────
    function renderKPIs() {
      const clients = getData('clients');
      document.getElementById('kpi-total').textContent = clients.length;
      document.getElementById('kpi-active').textContent = clients.filter(c => c.status === 'Active').length;
      document.getElementById('kpi-pending').textContent = clients.filter(c => c.status === 'Pending').length;
      document.getElementById('kpi-paused').textContent = clients.filter(c => c.status === 'Paused').length;
    }

    // ── Color from name ───────────────────────────────────────
    function colorFromName(name) {
      const colors = ['#2E5C7A', '#3D5A3E', '#C8782A', '#C4553A', '#D4A843', '#6B4E8A'];
      let hash = 0;
      for (const ch of (name || '')) hash = ch.charCodeAt(0) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

    // ── Render grid ───────────────────────────────────────────
    function renderClients() {
      let clients = getData('clients');
      if (currentFilter !== 'All') clients = clients.filter(c => c.status === currentFilter);
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        clients = clients.filter(c =>
          (c.name || '').toLowerCase().includes(q) ||
          (c.city || '').toLowerCase().includes(q) ||
          (c.email || '').toLowerCase().includes(q)
        );
      }
      const grid = document.getElementById('clients-grid');
      if (!clients.length) {
        grid.innerHTML = '<p id="empty-msg">No clients found.</p>';
        return;
      }
      grid.innerHTML = clients.map((c, i) => `
        <div class="client-card" data-id="${c.id}">
          <div class="client-stripe" style="background:${colorFromName(c.name)}"></div>
          <div class="client-body">
            <h3 class="client-name">${c.name || 'Unnamed'}</h3>
            <p class="client-meta">${c.city || '—'}</p>
            <p class="client-meta">${c.instagram || ''}</p>
            <div class="client-badges">
              <span class="badge plan-badge">${c.plan || '—'}</span>
              <span class="badge status-badge status-${(c.status || '').toLowerCase()}">${c.status || '—'}</span>
            </div>
            <div class="client-actions">
              <button class="view-btn" data-id="${c.id}">View details</button>
              <button class="del-btn" data-id="${c.id}" title="Delete">🗑</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ── CRUD ──────────────────────────────────────────────────
    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add New Client';
      document.getElementById('client-form').reset();
      document.getElementById('client-id').value = '';
      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function openEditModal(client) {
      document.getElementById('modal-title').textContent = 'Edit Client';
      document.getElementById('client-id').value = client.id;
      document.getElementById('f-name').value = client.name || '';
      document.getElementById('f-city').value = client.city || '';
      document.getElementById('f-instagram').value = client.instagram || '';
      document.getElementById('f-email').value = client.email || '';
      document.getElementById('f-plan').value = client.plan || 'Starter';
      document.getElementById('f-status').value = client.status || 'Active';
      document.getElementById('f-notes').value = client.notes || '';
      document.getElementById('view-overlay').classList.add('hidden');
      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }

    document.getElementById('client-form').addEventListener('submit', e => {
      e.preventDefault();
      const clients = getData('clients');
      const id = document.getElementById('client-id').value;
      const client = {
        id: id || Date.now().toString(),
        name: document.getElementById('f-name').value.trim(),
        city: document.getElementById('f-city').value.trim(),
        instagram: document.getElementById('f-instagram').value.trim(),
        email: document.getElementById('f-email').value.trim(),
        plan: document.getElementById('f-plan').value,
        status: document.getElementById('f-status').value,
        notes: document.getElementById('f-notes').value.trim(),
        createdAt: id ? (clients.find(c => c.id === id) || {}).createdAt : new Date().toISOString()
      };
      if (id) {
        const idx = clients.findIndex(c => c.id === id);
        if (idx > -1) clients[idx] = client;
      } else {
        clients.push(client);
      }
      saveData('clients', clients);
      closeModal();
      renderKPIs();
      renderClients();
    });

    // ── View modal ────────────────────────────────────────────
    function openViewModal(client) {
      document.getElementById('view-content').innerHTML = `
        <h2>${client.name}</h2>
        <p><strong>City:</strong> ${client.city || '—'}</p>
        <p><strong>Instagram:</strong> ${client.instagram || '—'}</p>
        <p><strong>Email:</strong> ${client.email || '—'}</p>
        <p><strong>Plan:</strong> ${client.plan || '—'}</p>
        <p><strong>Status:</strong> ${client.status || '—'}</p>
        <p><strong>Notes:</strong> ${client.notes || '—'}</p>
        <p><strong>Added:</strong> ${client.createdAt ? new Date(client.createdAt).toLocaleDateString() : '—'}</p>
      `;
      document.getElementById('view-edit-btn').onclick = () => openEditModal(client);
      document.getElementById('view-overlay').classList.remove('hidden');
    }

    // ── Event delegation ──────────────────────────────────────
    document.getElementById('clients-grid').addEventListener('click', e => {
      const id = e.target.dataset.id;
      if (!id) return;
      const clients = getData('clients');
      const client = clients.find(c => c.id === id);
      if (e.target.classList.contains('view-btn') && client) openViewModal(client);
      if (e.target.classList.contains('del-btn')) {
        if (!confirm(`Delete ${client ? client.name : 'this client'}?`)) return;
        saveData('clients', clients.filter(c => c.id !== id));
        renderKPIs();
        renderClients();
      }
    });

    // ── Search & filter ───────────────────────────────────────
    document.getElementById('search-input').addEventListener('input', e => {
      searchQuery = e.target.value;
      renderClients();
    });

    document.getElementById('filter-tabs').addEventListener('click', e => {
      if (!e.target.classList.contains('tab')) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.filter;
      renderClients();
    });

    // ── Modal controls ────────────────────────────────────────
    document.getElementById('add-client-btn').addEventListener('click', openAddModal);
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('view-close').addEventListener('click', () =>
      document.getElementById('view-overlay').classList.add('hidden')
    );
    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    });
    document.getElementById('view-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('view-overlay'))
        document.getElementById('view-overlay').classList.add('hidden');
    });

    // ── Export CSV ────────────────────────────────────────────
    document.getElementById('export-csv-btn').addEventListener('click', () => {
      const clients = getData('clients');
      const headers = ['Name', 'City', 'Instagram', 'Email', 'Plan', 'Status', 'Notes', 'Created'];
      const rows = clients.map(c => [
        c.name, c.city, c.instagram, c.email, c.plan, c.status, c.notes, c.createdAt
      ].map(v => `"${(v || '').replace(/"/g, '""')}"`).join(','));
      const csv = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'brewstudio-clients.csv';
      a.click();
    });

    // ── Cloud Sync ────────────────────────────────────────────
    const SYNC_CONFIG = {
      get binId() { return localStorage.getItem('brewstudio_bin_id'); },
      get apiKey() { return localStorage.getItem('brewstudio_api_key'); }
    };
    const SYNC_KEYS = ['clients', 'tasks', 'audits', 'invoices', 'settings', 'checklist'];

    let syncTimeout;
    function scheduleSync() {
      clearTimeout(syncTimeout);
      syncTimeout = setTimeout(pushToCloud, 2000);
    }

    function updateSyncStatus(status) {
      const dot = document.getElementById('sync-dot');
      const label = document.getElementById('sync-label');
      const colors = { synced: '#3D5A3E', syncing: '#D4A843', error: '#C4553A' };
      const labels = { synced: 'Synced', syncing: 'Syncing…', error: 'Offline' };
      dot.style.backgroundColor = colors[status];
      label.textContent = labels[status];
    }

    async function pushToCloud() {
      if (!SYNC_CONFIG.binId || !SYNC_CONFIG.apiKey) return;
      updateSyncStatus('syncing');
      const payload = {};
      SYNC_KEYS.forEach(k => { payload[k] = getData(k); });
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${SYNC_CONFIG.binId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': SYNC_CONFIG.apiKey },
          body: JSON.stringify(payload)
        });
        localStorage.setItem('brewstudio_last_sync', Date.now());
        updateSyncStatus('synced');
      } catch { updateSyncStatus('error'); }
    }

    async function pullFromCloud() {
      if (!SYNC_CONFIG.binId || !SYNC_CONFIG.apiKey) return;
      updateSyncStatus('syncing');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${SYNC_CONFIG.binId}/latest`, {
          headers: { 'X-Master-Key': SYNC_CONFIG.apiKey }
        });
        const json = await res.json();
        const data = json.record || {};
        SYNC_KEYS.forEach(k => { if (data[k]) localStorage.setItem('brewstudio_' + k, JSON.stringify(data[k])); });
        localStorage.setItem('brewstudio_last_sync', Date.now());
        updateSyncStatus('synced');
      } catch { updateSyncStatus('error'); }
    }

    async function autoSync() {
      const lastSync = localStorage.getItem('brewstudio_last_sync');
      if (!lastSync || Date.now() - parseInt(lastSync) > 30 * 60 * 1000) await pullFromCloud();
    }

    // ── Mobile sidebar ────────────────────────────────────────
    document.getElementById('hamburger').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    // ── Init ──────────────────────────────────────────────────
    autoSync().then(() => {
      renderKPIs();
      renderClients();
    });
  </script>

</body>
</html>
